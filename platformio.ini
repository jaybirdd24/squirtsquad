; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_src_filter = +<*> -<ir_calibrate.cpp> -<scan360.cpp>
    -<fan_test.cpp> -<light_detection_test.cpp>
lib_deps =
    arduino-libraries/Servo
    adafruit/Adafruit BNO08x

[env:ir_calibrate]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_src_filter = -<*> +<ir_calibrate.cpp>
monitor_speed = 115200

[env:scan360]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =
    arduino-libraries/Servo
    adafruit/Adafruit BNO08x
build_src_filter = +<*> -<main.cpp> -<fsm.cpp> -<ir_calibrate.cpp>
    -<fan_test.cpp> -<light_detection_test.cpp>
monitor_speed = 115200

[env:fan_test]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_src_filter = -<*> +<fan_test.cpp>
monitor_speed = 115200

[env:light_detection_test]
platform = atmelavr
board = megaatmega2560
framework = arduino
lib_deps =
    arduino-libraries/Servo
    adafruit/Adafruit BNO08x
build_src_filter = +<*> -<main.cpp> -<fsm.cpp> -<ir_calibrate.cpp> -<scan360.cpp>
monitor_speed = 115200
